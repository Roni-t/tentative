
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tentative_backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - tentative_data:/app/data
    expose:
      - "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tentative_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  tentative_data:
    driver: local
